# Done to increase the memory available to Gradle when you import it as a project
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Minecraft / Fabric
minecraft_version=26.2
loader_version=0.19.3
fabric_version=0.157.0+26.2
modmenu_version=20.0.1

# JEI (BlameJared maven; optional — compile-time API only, full jar in the dev runtime)
jei_version=30.25.0.177

# Cardinal Components API (ladysnake maven; bundled jar-in-jar at build time)
cca_version=8.0.1

# Forge Config API Port (Fuzs maven; external dependency — declared in fabric.mod.json
# `depends`, installed separately per the Fuzs ecosystem convention, not bundled jar-in-jar).
# Version tracks the Minecraft branch (26.2.x -> 26.2.1).
forge_config_api_port_version=26.2.1

# EvalEx math expression compiler (Maven Central; bundled jar-in-jar, no transitive deps).
evalex_version=3.7.0

# Mod properties
mod_version=1.0.0
maven_group=dev.krysztal
archives_base_name=casualtiesbelow

# Scala
# Compile with the same Scala 3 version that krysztal-language-scala bundles at runtime.
scala_version=3.8.4
krysztal_scala_version=3.4.1+scala.3.8.4
